<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#050505"/>
  <title>Party House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/tokens.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }

    /* Flyer cubre toda la pantalla */
    .flyer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
    }

    /* CTA - desktop */
    .cta-wrap {
      position: fixed;
      z-index: 20;
      top: 67%;
      left: 25%;
      transform: translateX(-50%);
      width: 44%;
      max-width: 460px;
    }

    .cta-btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(90deg, #1D4FFF 0%, #5D2D91 50%, #FF2E9A 100%);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 2.2vw, 26px);
      letter-spacing: .13em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 0 24px rgba(29,79,255,.4), 0 0 48px rgba(255,46,154,.2);
    }
    .cta-btn:hover  { opacity: .88; transform: translateY(-1px); }
    .cta-btn:active { opacity: 1;   transform: translateY(0); }

    /* Mobile */
    @media (max-width: 640px) {
      html, body { overflow: auto; height: auto; }

      .flyer {
        position: relative;
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        content: url('/img/vertical.png');
      }

      .cta-wrap {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: calc(100% - 32px);
        max-width: none;
        margin: 16px auto 32px;
      }

      .cta-btn {
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <img class="flyer" src="/img/landing.png" alt="Party House"/>

  <div class="cta-wrap">
    <a href="/evento.html?c=PH0108" class="cta-btn">CONSEGUIR MI ENTRADA &rarr;</a>
  </div>

</body>
</html>
